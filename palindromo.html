
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromos</title>
</head>
<body>
    <h1>Verificador de palabras palindromas</h1>
    <input type="text" id="inputTexto" placeholder="pon la palabra o frase">
    <button onclick="verificarPalindromo()">Verificar</button>
    <p id="resultado"></p>

    <script>
        function esPalindromo(texto) {
                      const textoLimpio = texto.toLowerCase().replace(/[^a-z0-9]/g, '');
                        const textoInvertido = textoLimpio.split('').reverse().join('');
            return textoLimpio === textoInvertido;
        }

        function verificarPalindromo() {
            const inputTexto = document.getElementById("inputTexto").value;
            const resultado = esPalindromo(inputTexto) ? "Es un palíndromo" : "No es un palíndromo";
            document.getElementById("resultado").innerText = resultado;
        }
    </script>
</body>
</html>
